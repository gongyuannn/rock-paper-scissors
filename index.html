<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="myscript.js" defer></script>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>
    <!-- Add in a title and instructions for the page -->
    <div class="container">
        
        <h1 class="game-title">Rock, Paper, Scissors</h1>
        
        <p class="instructions">
            Select rock, paper, or scissors by clicking the buttons below. PC will go next. First to reach a score of '5' wins!
        </p>

        <div class="image-container">
            <div class="image-box">
                <img src="./images/rock.png" alt="Hand representing rock">
                <button class="btn" id="rock">Rock</button>
            </div>
            <div class="image-box">
                <img src="./images/paper.png" alt="Hand representing paper">
                <button class="btn" id="paper">Paper</button>
            </div>
            <div class="image-box">
                <img src="./images/scissors.png" alt="Hand representing scissors">
                <button class="btn" id="scissors">Scissors</button>
            </div>    
        </div>

        <div id="scoreboard">
            <h3>Scoreboard</h3>
            <div class="score-container">
                <p id="player-score">Player: 0</p>
                <p id="pc-score">PC: 0</p>
            </div>
        </div>
    
    </div>

</body>
</html>
